<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshCart - Fresh Vegetables</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4fff4;
            color: #222;
        }
        header {
            background: #16a34a;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        .welcome {
            font-size: 24px;
            font-weight: bold;
            color: #15803d;
            margin-bottom: 10px;
        }
        .card {
            background: white;
            padding: 30px 20px;
            margin: 30px auto;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover {
            background: #15803d;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <h1>🥬 FreshCart</h1>
        <p>Fresh Vegetables Delivered to Your Doorstep</p>
    </header>
    <div class="container">
        <div class="card">
            <div class="welcome">Welcome to FreshCart!</div>
            <p>Order fresh and quality vegetables from your home.</p>
            <button onclick="showProducts()">Start Shopping</button>
        </div>
    </div>
    <div id="products" style="display:none; text-align:center; padding:20px;">
    <h2>🥬 Fresh Vegetables</h2>
    <div style="background:white; padding:15px; border-radius:10px; max-width:300px; margin:auto;">
        <p>🍅 টমেটো - ৩০ টাকা</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>
</div>

<script>
function showProducts(){
    document.getElementById('products').style.display = 'block';
}
</script>
    function addToCart(){
    alert("🍅 টমেটো Cart-এ যোগ হয়েছে!");
}
</body>
</html>
