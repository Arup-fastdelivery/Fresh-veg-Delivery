<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshCart - Fresh Vegetables</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4fff4; color: #222; }
        header { background: #16a34a; color: white; padding: 25px 20px; text-align: center; }
        h1 { margin: 0; }
        .container { padding: 20px; text-align: center; }
        .welcome { font-size: 24px; font-weight: bold; color: #15803d; margin-bottom: 10px; }
        .card { background: white; padding: 30px 20px; margin: 30px auto; max-width: 400px; border-radius: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        button { background: #16a34a; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background: #15803d; transform: scale(1.05); }
    </style>
</head>
<body>
    <header>
        <h1>🥬 FreshCart</h1>
        <p>Fresh Vegetables Delivered to Your Doorstep</p>
    </header>
    <div class="container">
        <div class="card">
            <div class="welcome">Welcome to FreshCart!</div>
            <p>Order fresh and quality vegetables from your home.</p>
            <button onclick="showProducts()">Start Shopping</button>
        </div>
    </div>

    <div id="products" style="display:none; text-align:center; padding:20px;">
        <h2>🥬 Fresh Vegetables</h2>
        <div style="background:white; padding:20px; border-radius:12px; max-width:320px; margin:auto;">
            <h3>🍅 টমেটো</h3>
            <p>দাম: ৩০ টাকা / কেজি</p>
            <div style="margin: 15px 0;">
                <button onclick="changeQty(-1)" style="padding:5px 12px;">-</button>
                <span id="qty" style="margin:0 10px; font-weight:bold; font-size:18px;">1</span> কেজি
                <button onclick="changeQty(1)" style="padding:5px 12px;">+</button>
            </div>
            <p style="font-weight:bold; color:#15803d; font-size:18px;">মোট: <span id="totalPrice">৩০</span> টাকা</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>
    </div>

<script>
let pricePerKg = 30;
let quantity = 1;

function showProducts(){
    document.getElementById('products').style.display = 'block';
}

function changeQty(change){
    quantity += change;
    if(quantity < 1) quantity = 1;
    document.getElementById('qty').innerText = quantity;
    document.getElementById('totalPrice').innerText = pricePerKg * quantity;
}

function addToCart(){
    let total = pricePerKg * quantity;
    alert("🍅 " + quantity + " কেজি টমেটো Cart-এ যোগ হয়েছে! মোট: " + total + " টাকা");
}
</script>

</body>
</html>
